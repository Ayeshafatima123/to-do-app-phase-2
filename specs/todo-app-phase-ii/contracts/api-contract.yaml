# API Contract: Todo App Phase II

## OpenAPI Specification for Todo App REST API

### Base URL
```
https://your-domain.com/api/{user_id}
```

### Authentication
All endpoints require JWT token in Authorization header:
```
Authorization: Bearer <JWT_TOKEN>
```

## Endpoints

### GET /api/{user_id}/tasks
**Description**: Retrieve all tasks for the specified user

#### Parameters
- **user_id** (path, required): ID of the user whose tasks to retrieve

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Responses
- **200 OK**: Successfully retrieved tasks
  ```json
  [
    {
      "id": 1,
      "title": "Sample task",
      "description": "Task description",
      "completed": false,
      "user_id": "user123",
      "created_at": "2026-01-12T10:30:00Z"
    }
  ]
  ```
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **422 Unprocessable Entity**: Invalid user_id format

### POST /api/{user_id}/tasks
**Description**: Create a new task for the specified user

#### Parameters
- **user_id** (path, required): ID of the user creating the task

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Request Body
```json
{
  "title": "New task title",
  "description": "Optional task description"
}
```

#### Responses
- **201 Created**: Task successfully created
  ```json
  {
    "id": 2,
    "title": "New task title",
    "description": "Optional task description",
    "completed": false,
    "user_id": "user123",
    "created_at": "2026-01-12T10:30:00Z"
  }
  ```
- **400 Bad Request**: Invalid request body
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **422 Unprocessable Entity**: Validation error (e.g., title too long)

### GET /api/{user_id}/tasks/{id}
**Description**: Retrieve a specific task by ID

#### Parameters
- **user_id** (path, required): ID of the user
- **id** (path, required): ID of the task to retrieve

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Responses
- **200 OK**: Successfully retrieved task
  ```json
  {
    "id": 1,
    "title": "Sample task",
    "description": "Task description",
    "completed": false,
    "user_id": "user123",
    "created_at": "2026-01-12T10:30:00Z"
  }
  ```
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **404 Not Found**: Task not found
- **422 Unprocessable Entity**: Invalid ID format

### PUT /api/{user_id}/tasks/{id}
**Description**: Update a specific task

#### Parameters
- **user_id** (path, required): ID of the user
- **id** (path, required): ID of the task to update

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Request Body
```json
{
  "title": "Updated task title",
  "description": "Updated task description",
  "completed": true
}
```

#### Responses
- **200 OK**: Task successfully updated
  ```json
  {
    "id": 1,
    "title": "Updated task title",
    "description": "Updated task description",
    "completed": true,
    "user_id": "user123",
    "created_at": "2026-01-12T10:30:00Z"
  }
  ```
- **400 Bad Request**: Invalid request body
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **404 Not Found**: Task not found
- **422 Unprocessable Entity**: Validation error

### DELETE /api/{user_id}/tasks/{id}
**Description**: Delete a specific task

#### Parameters
- **user_id** (path, required): ID of the user
- **id** (path, required): ID of the task to delete

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Responses
- **204 No Content**: Task successfully deleted
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **404 Not Found**: Task not found
- **422 Unprocessable Entity**: Invalid ID format

### PATCH /api/{user_id}/tasks/{id}/complete
**Description**: Toggle the completion status of a task

#### Parameters
- **user_id** (path, required): ID of the user
- **id** (path, required): ID of the task to update

#### Headers
- Authorization: Bearer <JWT_TOKEN>

#### Request Body
```json
{
  "completed": true
}
```

#### Responses
- **200 OK**: Task completion status successfully updated
  ```json
  {
    "id": 1,
    "title": "Sample task",
    "description": "Task description",
    "completed": true,
    "user_id": "user123",
    "created_at": "2026-01-12T10:30:00Z"
  }
  ```
- **400 Bad Request**: Invalid request body
- **401 Unauthorized**: Invalid or missing token
- **403 Forbidden**: User ID in token doesn't match URL user_id
- **404 Not Found**: Task not found
- **422 Unprocessable Entity**: Invalid ID format or request body

## Error Response Format

All error responses follow this format:
```json
{
  "detail": "Error message explaining what went wrong"
}
```

## Validation Rules

1. **Title**: Required, 1-255 characters
2. **Description**: Optional, 0-1000 characters
3. **Completed**: Boolean value (true/false)
4. **User ID**: Must match the authenticated user's ID from JWT token
5. **Task ID**: Must be a positive integer

## Security Requirements

1. JWT token validation on every request
2. User ID in JWT token must match user_id in URL path
3. Users can only access their own tasks
4. Proper error handling without information leakage